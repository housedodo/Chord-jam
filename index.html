<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jam Session</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Jam Session</h1>
    <p class="subtitle">Build chord progressions, hear them instantly</p>
  </header>

  <main>
    <section class="controls">
      <div class="control-group">
        <label for="key-select">Key</label>
        <select id="key-select"></select>
      </div>
      <div class="control-group">
        <label for="scale-select">Scale</label>
        <select id="scale-select">
          <option value="major">Major</option>
          <option value="minor">Minor</option>
          <option value="dorian">Dorian</option>
          <option value="mixolydian">Mixolydian</option>
        </select>
      </div>
      <div class="control-group">
        <label for="tempo-slider">BPM <span id="tempo-value">120</span></label>
        <input type="range" id="tempo-slider" min="40" max="220" value="120">
      </div>
      <div class="control-group">
        <label for="beats-select">Beats/chord</label>
        <select id="beats-select">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="4">4</option>
        </select>
      </div>
      <div class="control-group">
        <label for="sound-select">Sound</label>
        <select id="sound-select">
          <option value="warm-pad">Warm Pad</option>
          <option value="electric-piano">Electric Piano</option>
          <option value="bright-keys">Bright Keys</option>
          <option value="soft-strings">Soft Strings</option>
        </select>
      </div>
    </section>

    <section class="chord-palette">
      <h2>Chords <span class="hint">(click to preview, double-click to add)</span></h2>
      <div class="palette-tabs">
        <button class="palette-tab active" data-tab="diatonic">Diatonic</button>
        <button class="palette-tab" data-tab="extended">Extended</button>
        <button class="palette-tab" data-tab="all">All Chords</button>
      </div>
      <div id="chord-grid" class="chord-grid"></div>
    </section>

    <section class="presets">
      <h2>Quick Presets</h2>
      <div id="preset-list" class="preset-list"></div>
    </section>

    <section class="progression-section">
      <div class="progression-header">
        <h2>Your Progression</h2>
        <div class="progression-actions">
          <button id="clear-btn" class="btn btn-small btn-ghost" title="Clear all">Clear</button>
          <button id="export-btn" class="btn btn-small btn-ghost" title="Copy as text">Copy</button>
        </div>
      </div>
      <div id="progression-track" class="progression-track">
        <div class="empty-state">Click or double-click chords above to build your progression</div>
      </div>
    </section>

    <section class="transport">
      <button id="play-btn" class="btn btn-play" title="Play / Pause">
        <svg id="play-icon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <polygon points="6,4 20,12 6,20"/>
        </svg>
        <svg id="pause-icon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" style="display:none">
          <rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/>
        </svg>
      </button>
      <button id="stop-btn" class="btn btn-stop" title="Stop">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <rect x="5" y="5" width="14" height="14" rx="2"/>
        </svg>
      </button>
      <button id="loop-btn" class="btn btn-loop active" title="Toggle loop">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/>
          <path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/>
        </svg>
      </button>
    </section>

    <div id="now-playing" class="now-playing" style="display:none">
      <span id="now-playing-text"></span>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="app.js"></script>
</body>
</html>
