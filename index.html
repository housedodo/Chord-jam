<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SOUND TELEPHONE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HOME screen -->
  <div id="screen-home" class="screen active">
    <div class="home-container">
      <h1 class="logo">SOUND<br>TELEPHONE</h1>
      <p class="tagline">Recreate songs together, one layer at a time</p>
      <div class="home-actions">
        <button id="btn-create" class="btn-primary">Create Room</button>
        <div class="join-row">
          <input id="input-code" type="text" class="code-input" placeholder="Room code" maxlength="6" autocomplete="off" spellcheck="false">
          <button id="btn-join" class="btn-secondary">Join</button>
        </div>
      </div>
      <div class="home-footer">
        <input id="input-name" type="text" class="name-input" placeholder="Your name" maxlength="20" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <!-- LOBBY screen -->
  <div id="screen-lobby" class="screen">
    <div class="lobby-container">
      <div class="lobby-header">
        <h2>Room <span id="room-code" class="room-code"></span></h2>
        <button id="btn-copy-code" class="btn-icon" title="Copy code">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
      </div>
      <div id="player-list" class="player-list"></div>
      <div id="host-controls" class="host-controls" style="display:none">
        <div class="song-input-row">
          <input id="input-song" type="text" class="song-input" placeholder="Enter song name..." maxlength="80" autocomplete="off" spellcheck="false">
        </div>
        <button id="btn-start" class="btn-primary" disabled>Start Game</button>
      </div>
      <div id="guest-waiting" class="guest-waiting">
        <p>Waiting for host to start...</p>
      </div>
      <button id="btn-leave" class="btn-text">Leave Room</button>
    </div>
  </div>

  <!-- REVEAL screen (shows the song name briefly) -->
  <div id="screen-reveal" class="screen">
    <div class="reveal-container">
      <p class="reveal-label">Recreate this song:</p>
      <h2 id="reveal-song" class="reveal-song"></h2>
      <p class="reveal-instrument">Your instrument: <strong id="reveal-instrument"></strong></p>
      <div class="reveal-timer">
        <div id="reveal-bar" class="reveal-bar"></div>
      </div>
    </div>
  </div>

  <!-- BUILD screen (instrument sequencer) -->
  <div id="screen-build" class="screen">
    <div class="build-container">
      <div class="build-header">
        <div class="build-info">
          <span id="build-song" class="build-song"></span>
          <span id="build-instrument" class="build-badge"></span>
        </div>
        <div class="build-timer">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="build-time"></span>
        </div>
      </div>

      <!-- Drums sequencer -->
      <div id="seq-drums" class="sequencer" style="display:none">
        <div class="seq-controls">
          <button id="drums-play" class="btn-seq-play" title="Play/Stop">
            <svg id="drums-play-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="7,4 21,12 7,20"/></svg>
            <svg id="drums-stop-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <div class="tempo-mini">
            <label>BPM</label>
            <input type="number" id="drums-bpm" class="bpm-input" value="120" min="60" max="200">
          </div>
        </div>
        <div id="drum-grid" class="drum-grid"></div>
      </div>

      <!-- Chords sequencer -->
      <div id="seq-chords" class="sequencer" style="display:none">
        <div class="seq-controls">
          <button id="chords-play" class="btn-seq-play" title="Play/Stop">
            <svg id="chords-play-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="7,4 21,12 7,20"/></svg>
            <svg id="chords-stop-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <div class="tempo-mini">
            <label>BPM</label>
            <input type="number" id="chords-bpm" class="bpm-input" value="120" min="60" max="200">
          </div>
        </div>
        <div class="chord-slots" id="chord-slots"></div>
        <div class="chord-palette" id="chord-palette"></div>
      </div>

      <!-- Bass sequencer -->
      <div id="seq-bass" class="sequencer" style="display:none">
        <div class="seq-controls">
          <button id="bass-play" class="btn-seq-play" title="Play/Stop">
            <svg id="bass-play-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="7,4 21,12 7,20"/></svg>
            <svg id="bass-stop-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <div class="tempo-mini">
            <label>BPM</label>
            <input type="number" id="bass-bpm" class="bpm-input" value="120" min="60" max="200">
          </div>
        </div>
        <div id="bass-grid" class="note-grid"></div>
      </div>

      <!-- Melody sequencer -->
      <div id="seq-melody" class="sequencer" style="display:none">
        <div class="seq-controls">
          <button id="melody-play" class="btn-seq-play" title="Play/Stop">
            <svg id="melody-play-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="7,4 21,12 7,20"/></svg>
            <svg id="melody-stop-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <div class="tempo-mini">
            <label>BPM</label>
            <input type="number" id="melody-bpm" class="bpm-input" value="120" min="60" max="200">
          </div>
        </div>
        <div id="melody-grid" class="note-grid"></div>
      </div>

      <button id="btn-submit" class="btn-primary btn-submit">Submit Layer</button>
    </div>
  </div>

  <!-- LISTEN screen (combined playback) -->
  <div id="screen-listen" class="screen">
    <div class="listen-container">
      <h2 class="listen-title">The Song Was:</h2>
      <h3 id="listen-song" class="listen-song"></h3>
      <div id="listen-layers" class="listen-layers"></div>
      <div class="listen-controls">
        <button id="btn-play-all" class="btn-primary">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="7,4 21,12 7,20"/></svg>
          Play All Layers
        </button>
        <button id="btn-stop-all" class="btn-secondary" style="display:none">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          Stop
        </button>
      </div>
      <div class="listen-actions">
        <button id="btn-play-again" class="btn-secondary">Play Again</button>
        <button id="btn-back-lobby" class="btn-text">Back to Lobby</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="app.js"></script>
</body>
</html>
